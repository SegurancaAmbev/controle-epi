<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle EPI</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><style>body{font-family:Arial;padding:20px;background:#f4f4f4}h1,h2{color:#333}.card{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px}input,select,button{padding:8px;margin:5px;width:100%}button{background:#0078d4;color:#fff;border:none;border-radius:5px;cursor:pointer}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#0078d4;color:#fff}.negativo{color:red;font-weight:bold}</style></head><body><h1>Controle de EPIs</h1><div class="card"><label>Unidade</label><select id="unidadeSelect"></select><label>Código do Material (Novo ou Antigo)</label><input id="codigo"><label>Quantidade Retirada</label><input type="number" id="qtd"><button onclick="registrarRetirada()">Registrar Retirada</button><h3 id="materialInfo"></h3><h3>Saldo Unidade: <span id="saldoUnidade">0</span></h3></div><h2>Resumo Geral</h2><table><thead><tr><th>Unidade</th><th>Quantidade Original</th><th>Quantidade Atual</th><th>Diferença</th></tr></thead><tbody id="resumoBody"></tbody></table><br><h2>Detalhamento da Unidade</h2><table><thead><tr><th>Unidade</th><th>Código Novo</th><th>Código Antigo</th><th>Descrição</th><th>Quantidade</th><th>Valor Unitário</th><th>Valor Total</th><th>Valor Restante</th><th>Diferença</th></tr></thead><tbody id="detalheBody"></tbody></table><script>let inventario=[];let retiradas=JSON.parse(localStorage.getItem("retiradas")||"[]");Papa.parse("Inventario.csv",{download:true,header:true,delimiter:";",complete:r=>{inventario=r.data.filter(x=>x["Unidade"]);carregarUnidades();atualizarTudo();}});function carregarUnidades(){let s=document.getElementById("unidadeSelect");let unidades=[...new Set(inventario.map(x=>x["Unidade"]))].sort();s.innerHTML='<option value="">Selecione</option>';unidades.forEach(u=>s.innerHTML+=`<option value="${u}">${u}</option>`);s.addEventListener("change",atualizarTudo)}function localizarMaterial(codigo){return inventario.find(i=>String(i["Material Novo"]).trim()==codigo||String(i["Material antigo"]).trim()==codigo)}function registrarRetirada(){let unidade=document.getElementById("unidadeSelect").value;let codigo=document.getElementById("codigo").value.trim();let qtd=Number(document.getElementById("qtd").value);if(!unidade||!codigo||!qtd)return;let material=localizarMaterial(codigo);if(!material){alert("Material não encontrado");return}retiradas.push({unidade,codigoNovo:material["Material Novo"],codigoAntigo:material["Material antigo"],qtd});localStorage.setItem("retiradas",JSON.stringify(retiradas));atualizarTudo()}function retiradaMaterial(unidade,codigo){return retiradas.filter(r=>r.unidade===unidade&&(r.codigoNovo===codigo||r.codigoAntigo===codigo)).reduce((a,b)=>a+b.qtd,0)}function atualizarTudo(){atualizarResumo();atualizarDetalhes()}function atualizarResumo(){let agrupado={};inventario.forEach(i=>{let u=i["Unidade"];let q=parseFloat(String(i["Quantidade"]).replace(".","").replace(",","."))||0;if(!agrupado[u])agrupado[u]={orig:0,ret:0};agrupado[u].orig+=q});retiradas.forEach(r=>{if(agrupado[r.unidade])agrupado[r.unidade].ret+=r.qtd});let body=document.getElementById("resumoBody");body.innerHTML="";Object.keys(agrupado).sort().forEach(u=>{let atual=agrupado[u].orig-agrupado[u].ret;let dif=agrupado[u].ret;body.innerHTML+=`<tr><td>${u}</td><td>${agrupado[u].orig.toFixed(0)}</td><td class="${atual<0?'negativo':''}">${atual.toFixed(0)}</td><td>${dif.toFixed(0)}</td></tr>`});let unidade=document.getElementById("unidadeSelect").value;if(unidade){let saldo=agrupado[unidade]?agrupado[unidade].orig-agrupado[unidade].ret:0;let span=document.getElementById("saldoUnidade");span.innerHTML=saldo.toFixed(0);span.className=saldo<0?"negativo":""}}function atualizarDetalhes(){let unidade=document.getElementById("unidadeSelect").value;if(!unidade)return;let mapa={};inventario.filter(i=>i["Unidade"]===unidade).forEach(i=>{let chave=i["Material Novo"];let qtd=parseFloat(String(i["Quantidade"]).replace(".","").replace(",","."))||0;let valor=parseFloat(String(i["Valor Unitário"]).replace("R$","").replace(/\./g,"").replace(",",".").trim())||0;if(!mapa[chave])mapa[chave]={unidade,cnovo:i["Material Novo"],cantigo:i["Material antigo"],desc:i["Texto breve material"],qtd:0,vu:valor};mapa[chave].qtd+=qtd});let lista=Object.values(mapa).map(i=>{let retirado=retiradaMaterial(unidade,i.cnovo);let restante=i.qtd-retirado;return{...i,restante,diferenca:retirado,total:i.qtd*i.vu}}).sort((a,b)=>a.diferenca-b.diferenca);let body=document.getElementById("detalheBody");body.innerHTML="";lista.forEach(i=>{body.innerHTML+=`<tr><td>${i.unidade}</td><td>${i.cnovo}</td><td>${i.cantigo}</td><td>${i.desc}</td><td>${i.qtd.toFixed(0)}</td><td>R$ ${i.vu.toFixed(2)}</td><td>R$ ${i.total.toFixed(2)}</td><td class="${i.restante<0?'negativo':''}">${i.restante.toFixed(0)}</td><td>${i.diferenca.toFixed(0)}</td>></body></html>
